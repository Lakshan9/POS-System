<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Hotel POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .offline-container {
            max-width: 400px;
        }
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .retry-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .retry-btn:hover {
            background: #7c3aed;
            transform: scale(1.02);
        }
        .retry-btn:active {
            transform: scale(0.98);
        }
        .offline-details {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
        .offline-details .version {
            color: #8b5cf6;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <span class="offline-icon">📡</span>
        <h1>You're Offline</h1>
        <p>
            Please check your internet connection.<br/>
            Some features may not be available offline.
        </p>
        <button class="retry-btn" onclick="location.reload()">
            🔄 Retry Connection
        </button>
        <div class="offline-details">
            <p>Hotel POS System <span class="version">v2.0</span></p>
            <p style="font-size:0.7rem;color:#475569;">PWA Ready • Offline Support</p>
        </div>
    </div>
</body>
</html>
