<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login - Hotel POS</title>
    <link rel="stylesheet" href="style-login.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />

    <!-- ===== FIREBASE SDK ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="logo-icon">🍽️</div>
            <h1>HOTEL POS</h1>
            <p>Point of Sale System</p>
        </div>
        
        <div class="login-form">
            <div class="input-group">
                <label for="username">👤 Username / Email</label>
                <input type="text" id="username" placeholder="Enter email" value="admin@hotel.com" autofocus />
            </div>
            
            <div class="input-group">
                <label for="password">🔒 Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" />
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>
            
            <button class="login-btn" onclick="handleLogin()">
                <span>🚀</span> Login
            </button>
            
            <div class="login-error" id="loginError"></div>
            
            <div class="login-footer">
                <span>Default: <strong>admin@hotel.com</strong> / <strong>admin123</strong></span>
                <span class="demo-hint">💡 Demo credentials</span>
                <span style="font-size:0.65rem;color:#94a3b8;">🔐 Cloud powered by Firebase</span>
            </div>
        </div>
    </div>
    
    <div class="login-footer-text">
        <p>© 2026 Hotel POS System. All rights reserved.</p>
    </div>
</div>

<script>
// ============================================================
//  FIREBASE CONFIG
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyBoc72fBPlF_pe_bHxy321oKeqt4U-wfis",
  authDomain: "hotel-pos-system-113c7.firebaseapp.com",
  databaseURL: "https://hotel-pos-system-113c7-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hotel-pos-system-113c7",
  storageBucket: "hotel-pos-system-113c7.firebasestorage.app",
  messagingSenderId: "1026466165620",
  appId: "1:1026466165620:web:c7ae28b94d5fdc8778f221",
  measurementId: "G-KP8GR66SC9"
};

// Initialize Firebase
try {
    firebase.initializeApp(firebaseConfig);
    console.log('✅ Firebase initialized successfully!');
    console.log('📁 Project:', firebaseConfig.projectId);
} catch (error) {
    console.error('❌ Firebase initialization error:', error);
}

const db = firebase.firestore();
const auth = firebase.auth();

// ============================================================
//  LOGIN FUNCTIONS
// ============================================================

function handleLogin() {
    const email = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    
    errorEl.style.display = 'none';
    errorEl.textContent = '';
    
    if (!email) {
        showError('❌ Please enter email!');
        document.getElementById('username').focus();
        return;
    }
    
    if (!password) {
        showError('❌ Please enter password!');
        document.getElementById('password').focus();
        return;
    }
    
    // Firebase Authentication
    auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Login success
            localStorage.setItem('hotel_logged_in', 'true');
            localStorage.setItem('hotel_username', userCredential.user.email);
            
            const btn = document.querySelector('.login-btn');
            btn.innerHTML = '<span>⏳</span> Logging in...';
            btn.disabled = true;
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        })
        .catch((error) => {
            let errorMessage = '❌ Login failed!';
            if (error.code === 'auth/user-not-found') {
                errorMessage = '❌ User not found! Please check your email.';
            } else if (error.code === 'auth/wrong-password') {
                errorMessage = '❌ Invalid password! Please try again.';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = '❌ Invalid email format!';
            } else if (error.code === 'auth/too-many-requests') {
                errorMessage = '❌ Too many attempts! Please try again later.';
            } else {
                errorMessage = '❌ ' + error.message;
            }
            showError(errorMessage);
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
            
            const box = document.querySelector('.login-box');
            box.style.animation = 'shake 0.5s ease';
            setTimeout(() => {
                box.style.animation = '';
            }, 500);
        });
}

function showError(message) {
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = message;
    errorEl.style.display = 'block';
}

function togglePassword() {
    const passwordInput = document.getElementById('password');
    const btn = document.querySelector('.toggle-password');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        btn.textContent = '🙈';
        btn.setAttribute('aria-label', 'Hide password');
    } else {
        passwordInput.type = 'password';
        btn.textContent = '👁️';
        btn.setAttribute('aria-label', 'Show password');
    }
}

document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
    }
});

document.getElementById('username').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
    }
});

document.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('hotel_logged_in') === 'true') {
        window.location.href = 'index.html';
    }
    
    setTimeout(() => {
        document.getElementById('username').focus();
    }, 100);
});

document.querySelector('.login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    handleLogin();
});

const style = document.createElement('style');
style.textContent = `
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
        20%, 40%, 60%, 80% { transform: translateX(10px); }
    }
`;
document.head.appendChild(style);
</script>

</body>
</html>
